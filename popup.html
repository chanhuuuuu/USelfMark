<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 320px;
            padding: 15px;
            font-family: sans-serif;
            background: #f4f7f6;
            margin: 0;
        }
        .card {
            text-align: center;
        }
        h3 {
            margin-top: 0;
            color: #222;
        }
        #clipBtn {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 6px;
            font-size: 14px;
        }
        #clipBtn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }
        #status {
            margin-top: 12px;
            font-size: 12px;
            color: #555;
            line-height: 1.5;
            white-space: pre-wrap;
            padding: 5px;
            background: #fff9db;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h3>USelfMark 本地AI整理</h3>
        <button id="clipBtn">📌 剪藏当前页面到Notion</button>
        <div id="status"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
